# Disposable BookStack test environment (system under test + database).
# Usage: copy .env.example to .env, then `docker compose up -d`.
# Reset to a clean state: `docker compose down -v`.

services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:version-v26.09.3
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      APP_URL: ${BOOKSTACK_URL}
      APP_KEY: ${BOOKSTACK_APP_KEY}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # All outgoing mail goes to Mailpit; nothing leaves the test environment.
      MAIL_DRIVER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: "null"
      MAIL_USERNAME: "null"
      MAIL_PASSWORD: "null"
      MAIL_FROM: bookstack@example.test
      MAIL_FROM_NAME: BookStack QA
    ports:
      - "${BOOKSTACK_PORT}:80"
    volumes:
      - bookstack_config:/config

  # Mail catcher: inbox UI and API at http://localhost:${MAILPIT_PORT}
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "${MAILPIT_PORT}:8025"

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql

volumes:
  bookstack_config:
  db_data:
