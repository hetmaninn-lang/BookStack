name: QA pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start BookStack test environment
        run: |
          cp .env.example .env
          docker compose up -d

      - name: Wait for BookStack to respond
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://localhost:6875/login; then
              echo "BookStack is up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "BookStack did not start in time"
          docker compose logs --tail 100
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install test dependencies
        working-directory: automation
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type-check tests
        working-directory: automation
        run: npm run typecheck

      - name: Run automated tests
        working-directory: automation
        run: npm test

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            automation/playwright-report/
            automation/test-results/
          retention-days: 14

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail 200
